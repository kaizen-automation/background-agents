name: Deploy Production (Kaizen)

# Kaizen production deployment from `main`. Secrets come from Doppler
# (project kaizen-code, config prd) via deploy/doppler/deploy.sh; the only
# GitHub secret is production/DOPPLER_TOKEN. Upstream terraform.yml also triggers on `main` but
# needs ~20 individual GitHub secrets; those stay unset, so it skips itself.

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - "terraform/**"
      - "scripts/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-production.yml"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a terraform apply

env:
  TF_VERSION: "1.14.8"

jobs:
  deploy:
    name: Apply Production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check deployment credential
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "::error::Configure DOPPLER_TOKEN in the production environment."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install Modal and Python dependencies
        run: uv sync --frozen
        working-directory: packages/modal-infra

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Check Doppler secrets
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: deploy/doppler/deploy.sh check

      - name: Terraform Init
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: deploy/doppler/deploy.sh init

      - name: Terraform Apply
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: deploy/doppler/deploy.sh apply 2 -no-color -auto-approve

      - name: Terraform Output
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: deploy/doppler/deploy.sh output -no-color
